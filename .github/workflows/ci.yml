name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Keycloak ${{ matrix.keycloak }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["25.0.6", "26.0.7", "26.6.3"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and unit-test (Keycloak ${{ matrix.keycloak }})
        run: mvn -B -Dkeycloak.version=${{ matrix.keycloak }} package

      - name: Integration tests against a real Keycloak ${{ matrix.keycloak }}
        run: |
          ci/magic-link-authenticator-test.sh ${{ matrix.keycloak }}
          ci/magic-link-admin-test.sh ${{ matrix.keycloak }}
          ci/magic-link-crosspath-test.sh ${{ matrix.keycloak }}
          ci/magic-link-events-test.sh ${{ matrix.keycloak }}
          ci/magic-link-modea-extra-test.sh ${{ matrix.keycloak }}

      - name: Upload provider jar
        if: matrix.keycloak == '26.0.7'
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-magic-link
          path: target/keycloak-magic-link.jar
          if-no-files-found: error
